<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPS FDE Asset Repository</title>
<style>
  :root {
    --bg:      #032D60;
    --surface: #0A3D73;
    --surface2:#0D4A8A;
    --border:  #1A5FA0;
    --text:    #FFFFFF;
    --muted:   #E2EEFF;
    --faint:   #A8C4E8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }

  /* ── TOP BAR ── */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: rgba(3,45,96,.92); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 14px 32px 20px;
    display: flex; align-items: center; gap: 12px;
  }
  .topbar-title { display: flex; align-items: center; gap: 12px; position: absolute; left: 50%; transform: translateX(-50%); }
  .topbar-title-text { font-size: 39px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; }
  .topbar-icon { width: 45px; height: 45px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
  .breadcrumb { display: none; align-items: center; gap: 8px; font-size: 13px; color: var(--faint); padding: 12px 32px; border-bottom: 1px solid var(--border); background: rgba(10,61,115,.5); }
  .breadcrumb.show { display: flex; }
  .breadcrumb-home { cursor: pointer; }
  .breadcrumb-home:hover { color: var(--text); }
  .breadcrumb-current { color: var(--text); font-weight: 600; }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .search-box {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; padding: 7px 13px; width: 220px;
  }
  .search-box input { background: none; border: none; outline: none; color: var(--text); font-size: 13px; width: 100%; }
  .search-box input::placeholder { color: var(--faint); }
  .topbar-btn {
    display: flex; align-items: center; gap: 6px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--faint); border-radius: 8px; padding: 6px 13px;
    font-size: 13px; font-weight: 500; cursor: pointer;
    transition: all .15s; white-space: nowrap; text-decoration: none;
  }
  .topbar-btn:hover { color: var(--text); border-color: rgba(255,255,255,.2); }
  .topbar-btn.edit-active { background: #FBBF24; border-color: #FBBF24; color: #032D60; }
  .back-btn {
    display: none; align-items: center; gap: 6px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--muted); border-radius: 8px; padding: 6px 13px;
    font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s;
  }
  .back-btn:hover { color: var(--text); border-color: var(--muted); }
  .back-btn.show { display: flex; }

  /* ── HOME ── */
  #home-view { padding: 28px 32px 36px; }
  .home-intro { margin-bottom: 24px; text-align: center; }
  .home-title-row { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 4px; }
  .home-title-row h2 { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  .home-icon { width: 38px; height: 38px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
  .home-intro p { color: var(--faint); font-size: 14px; }

  /* Quick access + Recent rows */
  .home-section { margin-bottom: 32px; }
  .home-section-title {
    font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
    color: var(--faint); margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
  }
  .home-section-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .quick-row { display: flex; gap: 10px; flex-wrap: wrap; }

  /* Pill item (pinned / recent) */
  .pill-item {
    display: flex; align-items: center; gap: 9px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 14px;
    text-decoration: none; color: inherit; cursor: pointer;
    transition: all .15s; max-width: 300px;
  }
  .pill-item:hover { border-color: rgba(255,255,255,.2); background: var(--surface2); }
  .pill-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .pill-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill-cat { font-size: 11px; color: var(--faint); white-space: nowrap; }
  .pin-active .pill-dot { background: #FBBF24; }

  /* Star button on ritems */
  .star-btn {
    position: absolute; top: 10px; right: 10px;
    width: 24px; height: 24px; border-radius: 6px;
    background: none; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--faint); transition: all .15s; opacity: 0;
  }
  .ritem:hover .star-btn { opacity: 1; }
  .star-btn.starred { opacity: 1; color: #FBBF24; }
  .star-btn:hover { color: #FBBF24; }
  body.editing .star-btn { display: none; }

  /* Category grid */
  .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .cat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden; cursor: pointer;
    transition: transform .15s, box-shadow .15s, border-color .15s;
  }
  .cat-card:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 16px 40px rgba(0,0,0,.5); border-color: rgba(255,255,255,.3); }
  .cat-banner { height: 5px; }
  .cat-body { padding: 20px 22px 22px; }
  .cat-icon-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .cat-icon { width: 42px; height: 42px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .cat-title { font-size: 16px; font-weight: 800; letter-spacing: -.01em; }
  .cat-desc { font-size: 13px; color: var(--muted); line-height: 1.55; margin-bottom: 16px; }
  .cat-count { font-size: 12px; color: var(--faint); display: flex; align-items: center; gap: 6px; }
  .cat-arrow { margin-top: 14px; display: flex; justify-content: flex-end; color: var(--faint); }

  /* ── RESOURCE VIEW ── */
  #res-view { display: none; padding: 28px 32px; }
  .res-header { margin-bottom: 22px; }
  .res-kicker { font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; margin-bottom: 4px; }
  .res-title { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  .res-desc { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .res-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .res-empty { color: var(--faint); font-size: 14px; padding: 48px 0; text-align: center; }

  /* Group heading */
  .group-heading { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .group-heading-label { font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); white-space: nowrap; }
  .group-heading-line { flex: 1; height: 1px; background: var(--border); }

  /* Resource item */
  .ritem {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 18px;
    display: flex; align-items: flex-start; gap: 13px;
    cursor: pointer; text-decoration: none; color: inherit;
    transition: transform .15s, box-shadow .15s, border-color .15s;
    position: relative;
  }
  .ritem:not(.edit-mode-item):hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 16px 40px rgba(0,0,0,.5); border-color: rgba(255,255,255,.3); }
  .ritem-icon { flex-shrink: 0; width: 38px; height: 38px; border-radius: 9px; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
  .ritem-body { flex: 1; min-width: 0; padding-right: 20px; }
  .ritem-title { font-size: 14px; font-weight: 700; color: var(--text); line-height: 1.3; margin-bottom: 4px; }
  .ritem-desc { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  .ritem-author { font-size: 12px; color: var(--faint); margin-top: 4px; display: flex; align-items: center; gap: 5px; }
  .ritem-url { font-size: 11px; color: var(--faint); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ritem-hierarchy { font-size: 11px; color: var(--faint); margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
  .ritem-arrow { flex-shrink: 0; color: var(--faint); margin-top: 10px; transition: color .15s; }
  .ritem:hover .ritem-arrow { color: var(--text); }

  /* ── EDIT MODE ── */
  .edit-actions { display: none; position: absolute; top: 10px; right: 10px; gap: 5px; }
  body.editing .edit-actions { display: flex; }
  body.editing .ritem { cursor: default; }
  body.editing .ritem:hover { transform: none; box-shadow: none; }
  .eact-btn {
    width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface2); display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all .15s; color: var(--faint);
  }
  .eact-btn:hover { color: var(--text); border-color: rgba(255,255,255,.2); }
  .eact-btn.del:hover { background: rgba(248,113,113,.15); border-color: #F87171; color: #F87171; }

  /* Inline edit form */
  .edit-form {
    background: var(--surface2); border: 1px solid #FBBF24;
    border-radius: 12px; padding: 14px 16px;
    display: flex; flex-direction: column; gap: 9px; grid-column: span 1;
  }
  .edit-form label { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); display: block; margin-bottom: 3px; }
  .edit-form input {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    color: var(--text); border-radius: 7px; padding: 7px 10px; font-size: 13px; outline: none; transition: border-color .15s;
  }
  .edit-form input:focus { border-color: #FBBF24; }
  .edit-form-btns { display: flex; gap: 7px; margin-top: 2px; }
  .ef-save { flex: 1; padding: 7px; border-radius: 7px; background: #FBBF24; border: none; color: #032D60; font-size: 13px; font-weight: 700; cursor: pointer; }
  .ef-cancel { padding: 7px 14px; border-radius: 7px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); font-size: 13px; cursor: pointer; }

  /* Add item */
  .add-item-btn {
    display: none; align-items: center; justify-content: center; gap: 8px;
    background: var(--surface); border: 1px dashed var(--border);
    border-radius: 12px; padding: 20px; cursor: pointer;
    color: var(--faint); font-size: 13px; font-weight: 500; transition: all .15s;
  }
  body.editing .add-item-btn { display: flex; }
  .add-item-btn:hover { border-color: #FBBF24; color: #FBBF24; }

  /* ── HOVER POPOVER ── */
  .hover-popover {
    position: fixed; z-index: 200;
    background: var(--surface2); border: 1px solid rgba(255,255,255,.22);
    border-radius: 14px; padding: 16px 18px; width: 290px;
    pointer-events: none;
    box-shadow: 0 24px 60px rgba(0,0,0,.65);
    opacity: 0; transform: scale(.95) translateY(6px);
    transition: opacity .18s, transform .18s;
  }
  .hover-popover.show { opacity: 1; transform: scale(1) translateY(0); }
  .pop-hierarchy { font-size: 11px; color: var(--faint); margin-bottom: 8px; display: flex; align-items: center; gap: 4px; }
  .pop-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; line-height: 1.35; }
  .pop-desc { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 8px; }
  .pop-url { font-size: 11px; color: var(--faint); word-break: break-all; line-height: 1.4; }
  .pop-open { margin-top: 12px; font-size: 12px; font-weight: 600; color: #60A5FA; display: flex; align-items: center; gap: 5px; }
  .pop-list-item { display: flex; align-items: center; gap: 7px; padding: 3px 0; font-size: 12.5px; color: var(--muted); line-height: 1.35; }
  .pop-list-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .pop-group-label { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin-top: 10px; margin-bottom: 2px; }
  .pop-count { color: var(--faint); font-size: 11px; margin-top: 8px; }
  .ritem-type {
    display: inline-flex; align-items: center;
    padding: 2px 7px; border-radius: 20px;
    font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    margin-top: 5px; width: fit-content;
  }

  /* ── APP BODY SPLIT ── */
  .app-body { display: flex; align-items: flex-start; }
  .main-content { flex: 1; min-width: 0; }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 196px; flex-shrink: 0;
    border-right: 1px solid var(--border);
    padding: 16px 0 32px;
    position: sticky; top: 55px;
    height: calc(100vh - 55px);
    overflow-y: auto;
  }
  .sb-section-label {
    font-size: 10px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase;
    color: var(--faint); padding: 16px 16px 6px;
  }
  .sb-item {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 16px; font-size: 13px; font-weight: 500;
    color: var(--muted); cursor: pointer;
    border-left: 2px solid transparent;
    transition: all .15s;
  }
  .sb-item:hover { color: var(--text); background: rgba(255,255,255,.04); }
  .sb-item.active { color: var(--text); font-weight: 600; background: rgba(255,255,255,.06); border-left-color: #60A5FA; }
  .sb-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .sb-count { margin-left: auto; font-size: 11px; color: var(--faint); font-weight: 400; }
</style>
</head>
<body>

<div class="hover-popover" id="hoverPopover"></div>

<div class="topbar">
  <div class="topbar-title" id="topbar-title">
    <img class="topbar-icon" src="https://img.icons8.com/color/1200/salesforce.jpg" alt="Salesforce">
    <span class="topbar-title-text">GPS FDE Asset Repository</span>
    <img class="topbar-icon" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQZPoL4y6Ifv5acolC0Hfzue96mJl48VWrWUmhK-x-5RQ&s=10" alt="">
  </div>
  <div class="topbar-right">
    <div class="search-box">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Search…">
    </div>
    <button class="back-btn" id="back-btn" onclick="goHome()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Back
    </button>
  </div>
</div>

<div class="app-body">
<nav class="sidebar" id="sidebar"></nav>
<div class="main-content">
<div class="breadcrumb" id="breadcrumb">
  <span class="breadcrumb-home" onclick="goHome()">Home</span>
  <span>›</span>
  <span class="breadcrumb-current" id="bc-current"></span>
</div>

<div id="home-view">
  <div id="pinned-section" class="home-section" style="display:none">
    <div class="home-section-title">Pinned</div>
    <div class="quick-row" id="pinned-row"></div>
  </div>
  <div id="recent-section" class="home-section" style="display:none">
    <div class="home-section-title" style="justify-content:space-between">
      <span style="display:flex;align-items:center;gap:8px">Recently Opened <span style="flex:1;height:1px;background:var(--border);display:inline-block;width:60px"></span></span>
      <button onclick="clearRecent()" style="background:none;border:none;color:var(--faint);font-size:11px;font-weight:600;cursor:pointer;letter-spacing:.08em;text-transform:uppercase;padding:0;transition:color .15s" onmouseover="this.style.color='#F87171'" onmouseout="this.style.color='var(--faint)'">Clear</button>
    </div>
    <div class="quick-row" id="recent-row"></div>
  </div>
  <div class="home-section">
    <div class="cat-grid" id="cat-grid"></div>
  </div>
</div>

<div id="res-view">
  <div class="res-header">
    <div class="res-kicker" id="rv-kicker"></div>
    <div class="res-title" id="rv-title"></div>
    <div class="res-desc" id="rv-desc"></div>
  </div>
  <div class="res-grid" id="res-grid"></div>
  <div class="res-empty" id="res-empty" style="display:none">Nothing here yet.</div>
</div>

</div><!-- /.main-content -->
</div><!-- /.app-body -->

  { id: "r1",  cat: "dashboards",   title: "AI Spend",                                             desc: "Track AI usage and spend across the team.", url: "https://team24-portal.forge-prod.sfdcbt.net/content-frame/ai-spend" },

// ── PERSISTENCE ───────────────────────────────────────────────────────────
function loadResources() {
  ["fde_hub_v1","fde_hub_v2","fde_hub_v3"].forEach(k => localStorage.removeItem(k));
  const saved = localStorage.getItem("fde_hub_v4");
  if (!saved) return JSON.parse(JSON.stringify(defaultResources));
  const merged = JSON.parse(saved);
  const savedIds = new Set(merged.map(r => r.id));
  defaultResources.forEach(r => {
    if (!savedIds.has(r.id)) {
      merged.push(r);
    } else {
      const existing = merged.find(x => x.id === r.id);
      if (existing) {
        if (r.type   && !existing.type)   existing.type   = r.type;
        if (r.author && !existing.author) existing.author = r.author;
        if (r.desc   === "" && existing.desc && existing.desc === existing.title) existing.desc = "";
      }
    }
  });
  return merged;
}
function saveResources() { localStorage.setItem("fde_hub_v4", JSON.stringify(resources)); }

function loadPinned()  { return JSON.parse(localStorage.getItem("fde_pinned") || "[]"); }
function savePinned()  { localStorage.setItem("fde_pinned", JSON.stringify(pinned)); }
function loadRecent()  { return JSON.parse(localStorage.getItem("fde_recent") || "[]"); }
function saveRecent()  { localStorage.setItem("fde_recent", JSON.stringify(recent)); }

let resources = loadResources();
let pinned    = loadPinned();
let recent    = loadRecent();

function nextId() { return "r" + Date.now(); }

// ── STATE ─────────────────────────────────────────────────────────────────
let currentCat    = null;
let searchQ       = "";
let editMode      = false;
let editingId     = null;
let sidebarFilter = null; // { kind: 'type'|'group', value: string }

// ── PIN & RECENT ──────────────────────────────────────────────────────────
function togglePin(id, e) {
  e.preventDefault(); e.stopPropagation();
  if (pinned.includes(id)) pinned = pinned.filter(p => p !== id);
  else pinned.unshift(id);
  savePinned();
  renderResources();
  renderHome();
}

function trackOpen(id) {
  recent = [id, ...recent.filter(r => r !== id)].slice(0, 8);
  saveRecent();
}


function clearRecent() {
  recent = [];
  saveRecent();
  renderHome();
}

function renderQuickRows() {
  const ps = document.getElementById("pinned-section");
  const rs = document.getElementById("recent-section");
  const pr = document.getElementById("pinned-row");
  const rr = document.getElementById("recent-row");

  const pinnedItems = pinned.map(id => resources.find(r => r.id === id)).filter(Boolean);
  ps.style.display = pinnedItems.length ? "block" : "none";
  pr.innerHTML = "";
  pinnedItems.forEach(r => {
    const cat = categories.find(c => c.id === r.cat);
    const a = document.createElement(r.url ? "a" : "div");
    a.className = "pill-item pin-active";
    if (r.url) { a.href = r.url; a.target = "_blank"; a.onclick = () => trackOpen(r.id); }
    a.innerHTML = `<div class="pill-dot" style="background:#FBBF24"></div><div class="pill-title">${r.title}</div><div class="pill-cat">${cat ? cat.title : ""}</div>`;
    pr.appendChild(a);
  });

  const recentItems = recent.map(id => resources.find(r => r.id === id)).filter(Boolean).slice(0, 6);
  rs.style.display = recentItems.length ? "block" : "none";
  rr.innerHTML = "";
  recentItems.forEach(r => {
    const cat = categories.find(c => c.id === r.cat);
    const a = document.createElement(r.url ? "a" : "div");
    a.className = "pill-item";
    if (r.url) { a.href = r.url; a.target = "_blank"; a.onclick = () => trackOpen(r.id); }
    a.innerHTML = `<div class="pill-dot" style="background:${cat ? cat.color : '#94A3B8'}"></div><div class="pill-title">${r.title}</div><div class="pill-cat">${cat ? cat.title : ""}</div>`;
    rr.appendChild(a);
  });
}

// ── SIDEBAR ───────────────────────────────────────────────────────────────
function renderSidebar() {
  const sb = document.getElementById("sidebar");
  sb.innerHTML = "";

  const isAll = !sidebarFilter && !currentCat;

  // All Resources
  const allEl = document.createElement("div");
  allEl.className = "sb-item" + (isAll ? " active" : "");
  allEl.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>All Resources<span class="sb-count">${resources.length}</span>`;
  allEl.onclick = () => { sidebarFilter = null; goHome(); };
  sb.appendChild(allEl);

  // By Type
  const typeMap = {};
  resources.forEach(r => { const t = getType(r); if (t) typeMap[t] = (typeMap[t] || 0) + 1; });
  const types = Object.keys(typeMap).sort();
  if (types.length) {
    const lbl = document.createElement("div"); lbl.className = "sb-section-label"; lbl.textContent = "By Type"; sb.appendChild(lbl);
    types.forEach(t => {
      const c = TYPE_COLORS[t] || TYPE_COLORS.Link;
      const el = document.createElement("div");
      el.className = "sb-item" + (sidebarFilter?.kind === "type" && sidebarFilter?.value === t ? " active" : "");
      el.innerHTML = `<div class="sb-dot" style="background:${c.color}"></div>${t}<span class="sb-count">${typeMap[t]}</span>`;
      el.onclick = () => setSidebarFilter("type", t);
      sb.appendChild(el);
    });
  }

  // By Group
  const groupMap = {};
  resources.forEach(r => { if (r.group) groupMap[r.group] = (groupMap[r.group] || 0) + 1; });
  const groups = Object.keys(groupMap).sort();
  if (groups.length) {
    const lbl = document.createElement("div"); lbl.className = "sb-section-label"; lbl.textContent = "By Group"; sb.appendChild(lbl);
    groups.forEach(g => {
      const el = document.createElement("div");
      el.className = "sb-item" + (sidebarFilter?.kind === "group" && sidebarFilter?.value === g ? " active" : "");
      el.innerHTML = `<div class="sb-dot" style="background:var(--faint)"></div>${g}<span class="sb-count">${groupMap[g]}</span>`;
      el.onclick = () => setSidebarFilter("group", g);
      sb.appendChild(el);
    });
  }
}

function setSidebarFilter(kind, value) {
  sidebarFilter = { kind, value };
  currentCat = null;
  searchQ = "";
  document.getElementById("searchInput").value = "";
  document.getElementById("home-view").style.display = "none";
  document.getElementById("res-view").style.display = "block";
  document.getElementById("breadcrumb").classList.remove("show");
  document.getElementById("back-btn").classList.add("show");
  document.getElementById("topbar-title").style.display = "none";

  const kicker = document.getElementById("rv-kicker");
  if (kind === "type") {
    const c = TYPE_COLORS[value] || TYPE_COLORS.Link;
    kicker.textContent = "Type";
    kicker.style.color = c.color;
  } else {
    kicker.textContent = "Group";
    kicker.style.color = "var(--faint)";
  }
  document.getElementById("rv-title").textContent = value;
  document.getElementById("rv-desc").textContent = "";

  renderSidebarResults();
  renderSidebar();
}

function renderSidebarResults() {
  const grid = document.getElementById("res-grid");
  const empty = document.getElementById("res-empty");
  grid.innerHTML = "";
  let filtered;
  if (sidebarFilter.kind === "type") {
    filtered = resources.filter(r => getType(r) === sidebarFilter.value);
  } else {
    filtered = resources.filter(r => r.group === sidebarFilter.value);
  }
  if (searchQ) filtered = filtered.filter(r => r.title.toLowerCase().includes(searchQ) || (r.desc||"").toLowerCase().includes(searchQ));
  empty.style.display = filtered.length === 0 ? "block" : "none";
  filtered.forEach(r => { const cat = categories.find(c => c.id === r.cat); grid.appendChild(makeRitem(r, cat, true)); });
}

// ── HOME ──────────────────────────────────────────────────────────────────
function renderHome() {
  renderQuickRows();
  const grid = document.getElementById("cat-grid");
  grid.innerHTML = "";

  if (searchQ) {
    const hits = resources.filter(r =>
      r.title.toLowerCase().includes(searchQ) || (r.desc||"").toLowerCase().includes(searchQ) || (r.group||"").toLowerCase().includes(searchQ)
    );
    if (!hits.length) {
      grid.innerHTML = `<div style="grid-column:1/-1;color:var(--faint);font-size:14px;padding:48px 0;text-align:center">No results for "${searchQ}"</div>`;
      return;
    }
    hits.forEach(r => { const cat = categories.find(c => c.id === r.cat); grid.appendChild(makeRitem(r, cat, true)); });
    return;
  }

  categories.forEach(cat => {
    const count = resources.filter(r => r.cat === cat.id).length;
    const card = document.createElement("div");
    card.className = "cat-card";
    card.dataset.catId = cat.id;
    card.onclick = () => openCat(cat.id);
    card.innerHTML = `
      <div class="cat-banner" style="background:${cat.color}"></div>
      <div class="cat-body">
        <div class="cat-icon-row">
          <div class="cat-icon" style="background:${cat.color}20;color:${cat.color}">${cat.icon}</div>
          <div class="cat-title">${cat.title}</div>
        </div>
        <div class="cat-desc">${cat.desc}</div>
        <div class="cat-count">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
          ${count === 0 ? "No items yet" : `${count} item${count === 1 ? "" : "s"}`}
        </div>
        <div class="cat-arrow"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>
      </div>`;
    grid.appendChild(card);
  });
}

// ── OPEN CAT ──────────────────────────────────────────────────────────────
function openCat(catId) {
  currentCat = catId; searchQ = ""; editingId = null; sidebarFilter = null;
  document.getElementById("searchInput").value = "";
  const cat = categories.find(c => c.id === catId);
  document.getElementById("rv-kicker").textContent = "Resources";
  document.getElementById("rv-kicker").style.color = cat.color;
  document.getElementById("rv-title").textContent = cat.title;
  document.getElementById("rv-desc").textContent = cat.desc;
  document.getElementById("home-view").style.display = "none";
  document.getElementById("res-view").style.display = "block";
  document.getElementById("breadcrumb").classList.add("show");
  document.getElementById("bc-current").textContent = cat.title;
  document.getElementById("back-btn").classList.add("show");
  document.getElementById("topbar-title").style.display = "none";
  renderResources();
  renderSidebar();
}

function goHome() {
  currentCat = null; editingId = null; sidebarFilter = null;
  document.getElementById("home-view").style.display = "block";
  document.getElementById("res-view").style.display = "none";
  document.getElementById("breadcrumb").classList.remove("show");
  document.getElementById("back-btn").classList.remove("show");
  document.getElementById("topbar-title").style.display = "flex";
  renderHome();
  renderSidebar();
}

const TYPE_COLORS = {
  Slack:     { bg: "rgba(167,139,250,.18)", color: "#A78BFA" },
  Doc:       { bg: "rgba(96,165,250,.18)",  color: "#60A5FA" },
  Slides:    { bg: "rgba(251,191,36,.18)",  color: "#FBBF24" },
  Video:     { bg: "rgba(248,113,113,.18)", color: "#F87171" },
  Dashboard: { bg: "rgba(52,211,153,.18)",  color: "#34D399" },
  Drive:     { bg: "rgba(96,165,250,.18)",  color: "#60A5FA" },
  PDF:       { bg: "rgba(251,146,60,.18)",  color: "#FB923C" },
  Blog:      { bg: "rgba(56,189,248,.18)",  color: "#38BDF8" },
  Link:      { bg: "rgba(148,163,184,.12)", color: "#94A3B8" },
};

function getType(r) {
  if (r.type) return r.type;
  const url = r.url || "";
  if (!url) return null;
  if (url.includes("slack.com")) return "Slack";
  if (url.includes("docs.google.com/presentation")) return "Slides";
  if (url.includes("docs.google.com/document")) return "Doc";
  if (url.includes("drive.google.com")) return "Drive";
  if (url.includes("forge-prod") || url.includes("/dashboard") || url.includes("/analytics")) return "Dashboard";
  return "Link";
}

function typeChipHtml(r) {
  const type = getType(r);
  if (!type) return "";
  const c = TYPE_COLORS[type] || TYPE_COLORS.Link;
  return `<div class="ritem-type" style="background:${c.bg};color:${c.color}">${type}</div>`;
}

// ── MAKE ITEM ─────────────────────────────────────────────────────────────
function makeRitem(r, cat, showHierarchy) {
  if (editingId === r.id) return makeEditForm(r, cat);
  const isStarred = pinned.includes(r.id);

  const a = document.createElement(editMode ? "div" : "a");
  a.className = "ritem";
  if (!editMode && r.url) {
    a.href = r.url; a.target = "_blank";
    a.addEventListener("click", () => trackOpen(r.id));
  }
  const hierarchyHtml = showHierarchy
    ? `<div class="ritem-hierarchy"><span>${cat ? cat.title : ""}</span>${r.group ? `<span>›</span><span>${r.group}</span>` : ""}</div>`
    : "";
  a.innerHTML = `
    <div class="ritem-icon" style="background:${cat.color}20;color:${cat.color}">${getIcon(r.url)}</div>
    <div class="ritem-body">
      ${hierarchyHtml}
      <div class="ritem-title">${r.title}</div>
      ${typeChipHtml(r)}
      ${r.author ? `<div class="ritem-author"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>${r.author}</div>` : ""}
      ${r.desc ? `<div class="ritem-desc">${r.desc}</div>` : ""}
      ${r.url ? `<div class="ritem-url">${r.url}</div>` : ""}
    </div>
    ${!editMode && r.url ? `<div class="ritem-arrow"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>` : ""}
    <button class="star-btn ${isStarred ? 'starred' : ''}" title="${isStarred ? 'Unpin' : 'Pin to top'}" onclick="togglePin('${r.id}', event)">${isStarred ? ICON_STAR_ON : ICON_STAR_OFF}</button>
    <div class="edit-actions">
      <div class="eact-btn" title="Edit" onclick="startEdit('${r.id}')"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></div>
      <div class="eact-btn del" title="Delete" onclick="deleteItem('${r.id}')"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg></div>
    </div>`;
  return a;
}

// ── EDIT FORM ─────────────────────────────────────────────────────────────
function makeEditForm(r, cat) {
  const groups = [...new Set(resources.filter(x => x.cat === currentCat && x.group).map(x => x.group))];
  const groupOptions = groups.map(g => `<option value="${g}" ${r.group===g?'selected':''}>${g}</option>`).join("");
  const div = document.createElement("div");
  div.className = "edit-form";
  div.innerHTML = `
    <div><label>Title</label><input id="ef-title" value="${(r.title||'').replace(/"/g,'&quot;')}" placeholder="Title"></div>
    <div><label>Author (optional)</label><input id="ef-author" value="${(r.author||'').replace(/"/g,'&quot;')}" placeholder="e.g. Kane Lo"></div>
    <div><label>Description</label><input id="ef-desc" value="${(r.desc||'').replace(/"/g,'&quot;')}" placeholder="Description (optional)"></div>
    <div><label>URL</label><input id="ef-url" value="${(r.url||'').replace(/"/g,'&quot;')}" placeholder="https://…"></div>
    <div><label>Group (optional)</label><input id="ef-group" value="${(r.group||'').replace(/"/g,'&quot;')}" list="ef-groups-list" placeholder="e.g. University of Melbourne">
      <datalist id="ef-groups-list">${groupOptions}</datalist></div>
    <div><label>Type (optional — auto-detected if blank)</label>
      <input id="ef-type" value="${(r.type||'').replace(/"/g,'&quot;')}" list="ef-types-list" placeholder="e.g. Video, Doc, Slack, Slides, Dashboard, Blog, PDF">
      <datalist id="ef-types-list">${Object.keys(TYPE_COLORS).map(t=>`<option value="${t}">`).join("")}</datalist>
    </div>
    <div class="edit-form-btns">
      <button class="ef-save" onclick="saveItem('${r.id}')">Save</button>
      <button class="ef-cancel" onclick="cancelEdit()">Cancel</button>
    </div>`;
  return div;
}

function startEdit(id) { editingId = id; renderResources(); }
function cancelEdit()  {
  const r = resources.find(x => x.id === editingId);
  if (r && !r.title) { resources = resources.filter(x => x.id !== editingId); saveResources(); }
  editingId = null; renderResources();
}

function saveItem(id) {
  const title  = document.getElementById("ef-title").value.trim();
  const author = document.getElementById("ef-author").value.trim();
  const desc   = document.getElementById("ef-desc").value.trim();
  const url    = document.getElementById("ef-url").value.trim();
  const group  = document.getElementById("ef-group").value.trim();
  const type   = document.getElementById("ef-type").value.trim();
  if (!title) return;
  const idx = resources.findIndex(r => r.id === id);
  if (idx > -1) resources[idx] = { ...resources[idx], title, author: author || undefined, desc, url, group: group || undefined, type: type || undefined };
  else resources.push({ id, cat: currentCat, title, author: author || undefined, desc, url, group: group || undefined, type: type || undefined });
  saveResources(); editingId = null; renderResources(); renderHome();
}

function deleteItem(id) {
  if (!confirm("Delete this item?")) return;
  resources = resources.filter(r => r.id !== id);
  pinned = pinned.filter(p => p !== id);
  recent = recent.filter(r => r !== id);
  saveResources(); savePinned(); saveRecent();
  renderResources(); renderHome();
}

function addItem(group) {
  const tempId = nextId();
  resources.push({ id: tempId, cat: currentCat, title: "", desc: "", url: "", group: group || undefined });
  editingId = tempId;
  renderResources();
}

// ── RENDER RESOURCES ──────────────────────────────────────────────────────
function renderResources() {
  const grid = document.getElementById("res-grid");
  const empty = document.getElementById("res-empty");
  grid.innerHTML = "";
  const cat = categories.find(c => c.id === currentCat);
  const filtered = resources.filter(r =>
    r.cat === currentCat &&
    (!searchQ || r.title.toLowerCase().includes(searchQ) || (r.desc||"").toLowerCase().includes(searchQ) || (r.group||"").toLowerCase().includes(searchQ))
  );
  empty.style.display = (!editMode && filtered.length === 0) ? "block" : "none";

  const ungrouped = filtered.filter(r => !r.group);
  const groups = [...new Set(filtered.filter(r => r.group).map(r => r.group))];

  ungrouped.forEach(r => grid.appendChild(makeRitem(r, cat)));
  if (editMode && !searchQ) {
    const btn = document.createElement("div");
    btn.className = "add-item-btn";
    btn.onclick = () => addItem(null);
    btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add item`;
    grid.appendChild(btn);
  }
  groups.forEach(g => {
    const h = document.createElement("div");
    h.className = "group-heading";
    h.innerHTML = `<div class="group-heading-label">${g}</div><div class="group-heading-line"></div>`;
    grid.appendChild(h);
    filtered.filter(r => r.group === g).forEach(r => grid.appendChild(makeRitem(r, cat)));
    if (editMode && !searchQ) {
      const btn = document.createElement("div");
      btn.className = "add-item-btn";
      btn.onclick = () => addItem(g);
      btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add to ${g}`;
      grid.appendChild(btn);
    }
  });
}

document.getElementById("searchInput").oninput = e => {
  searchQ = e.target.value.toLowerCase();
  if (currentCat) renderResources();
  else if (sidebarFilter) renderSidebarResults();
  else renderHome();
};

// ── HOVER POPOVER ─────────────────────────────────────────────────────────
const popover = document.getElementById("hoverPopover");
let popTimer = null;

document.addEventListener("mouseover", e => {
  if (editMode) return;

  const catCard = e.target.closest(".cat-card");
  if (catCard) {
    const catId = catCard.dataset.catId;
    const cat = categories.find(c => c.id === catId);
    if (!cat) return;
    clearTimeout(popTimer);
    popTimer = setTimeout(() => {
      const catResources = resources.filter(r => r.cat === catId);
      let listHtml = "";
      if (catResources.length === 0) {
        listHtml = `<div style="color:var(--faint);font-size:12px;">No items yet</div>`;
      } else {
        const MAX = 10;
        let count = 0;
        const ungrouped = catResources.filter(r => !r.group);
        const groups = [...new Set(catResources.filter(r => r.group).map(r => r.group))];
        ungrouped.forEach(r => {
          if (count < MAX) { listHtml += `<div class="pop-list-item"><div class="pop-list-dot" style="background:${cat.color}"></div><span>${r.title}</span></div>`; count++; }
        });
        groups.forEach(g => {
          if (count >= MAX) return;
          listHtml += `<div class="pop-group-label">${g}</div>`;
          catResources.filter(r => r.group === g).forEach(r => {
            if (count < MAX) { listHtml += `<div class="pop-list-item"><div class="pop-list-dot" style="background:${cat.color}"></div><span>${r.title}</span></div>`; count++; }
          });
        });
        const remaining = catResources.length - count;
        if (remaining > 0) listHtml += `<div class="pop-count">+${remaining} more</div>`;
      }
      popover.innerHTML = `
        <div class="pop-title" style="color:${cat.color};margin-bottom:10px">${cat.title}</div>
        ${listHtml}
      `;
      const rect = catCard.getBoundingClientRect();
      const pw = 260, ph = popover.offsetHeight || 120, gap = 10;
      let left = rect.right + gap;
      let top  = rect.top;
      if (left + pw > window.innerWidth - 12) left = rect.left - pw - gap;
      if (top + ph > window.innerHeight - 12) top = window.innerHeight - ph - 12;
      if (top < 8) top = 8;
      popover.style.left = left + "px";
      popover.style.top  = top  + "px";
      popover.classList.add("show");
    }, 180);
    return;
  }

  const ritem = e.target.closest(".ritem");
  if (!ritem) return;
  const id = ritem.querySelector(".star-btn")?.getAttribute("onclick")?.match(/'([^']+)'/)?.[1];
  if (!id) return;
  const r = resources.find(x => x.id === id);
  if (!r) return;
  const cat = categories.find(c => c.id === r.cat);

  clearTimeout(popTimer);
  popTimer = setTimeout(() => {
    const hierarchyHtml = cat
      ? `<div class="pop-hierarchy"><span>${cat.title}</span>${r.group ? `<span>›</span><span>${r.group}</span>` : ""}</div>`
      : "";
    popover.innerHTML = `
      ${hierarchyHtml}
      <div class="pop-title">${r.title}</div>
      ${r.desc ? `<div class="pop-desc">${r.desc}</div>` : ""}
      ${r.url ? `<div class="pop-url">${r.url}</div>` : ""}
      ${r.url ? `<div class="pop-open"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg> Click to open</div>` : ""}
    `;
    const rect = ritem.getBoundingClientRect();
    const pw = 290, ph = popover.offsetHeight || 160, gap = 10;
    let left = rect.right + gap;
    let top  = rect.top;
    if (left + pw > window.innerWidth - 12) left = rect.left - pw - gap;
    if (top + ph > window.innerHeight - 12) top = window.innerHeight - ph - 12;
    if (top < 8) top = 8;
    popover.style.left = left + "px";
    popover.style.top  = top  + "px";
    popover.classList.add("show");
  }, 220);
});

document.addEventListener("mouseout", e => {
  if (e.target.closest(".cat-card") || e.target.closest(".ritem")) {
    clearTimeout(popTimer);
    popover.classList.remove("show");
  }
});

renderHome();
renderSidebar();
</script>
</body>
</html>
